services:
  - type: web
    name: vittorio-coffee
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MAIL_TO
        value: pantzosantonis@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: pantzosantonis@gmail.com
      - key: MAIL_FROM
        value: pantzosantonis@gmail.com
      # SMTP_PASSWORD: set on the web service Environment tab OR upload Secret File
      # named smtp_password (mounted at /etc/secrets/smtp_password). Not in Blueprint —
      # sync:false placeholders are easy to miss on Blueprint updates.
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
