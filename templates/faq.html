{% extends "base.html" %}
{% block content %}
<section class="page-intro section">
  <p class="eyebrow">{{ _("Questions") }}</p>
  <h1>{{ _("Before you order.") }}</h1>
  <div class="card-grid">
    {% for item in faq %}
    <article class="faq-item">
      <h2>{{ _(item.question) }}</h2>
      <p>{{ _(item.answer) }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
