{% extends "base.html" %}
{% block content %}
<section class="page-intro section">
  <p class="eyebrow">Journal</p>
  <h1>From the trade floor.</h1>
  <p>Two notes from HO.RE.CA. 2019, when Vittorio met the hospitality trade in Athens.</p>
  <div class="card-grid">
    {% for article in articles %}
    <article class="note">
      <p class="eyebrow">{{ article.date_label }}</p>
      <h2><a href="{{ url_for('article', slug=article.slug) }}">{{ article.title }}</a></h2>
      <p>{{ article.summary }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
