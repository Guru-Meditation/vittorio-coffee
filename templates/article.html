{% extends "base.html" %}
{% block content %}
<article class="page-intro section prose">
  <p class="eyebrow">{{ _(article.date_label) }}</p>
  <h1>{{ _(article.title) }}</h1>
  {% for paragraph in article.body %}
  <p>{{ _(paragraph) }}</p>
  {% endfor %}
  <p><a href="{{ url_for('journal') }}">{{ _("All notes") }}</a></p>
</article>
{% endblock %}
